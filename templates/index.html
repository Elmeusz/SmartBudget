<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBudget - Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .balance-card {
            background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
            color: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.15);
            border: none;
        }
        .balance-amount {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -1px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-wallet2 text-info me-2"></i>SmartBudget
        </a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card balance-card text-center p-5 mb-4">
                <div class="card-body">
                    <h5 class="card-title text-uppercase mb-3 fw-semibold opacity-75" style="letter-spacing: 2px;">Aktualne Saldo</h5>
                    <div class="balance-amount mb-4">0.00 <span class="fs-2 fw-normal opacity-75">PLN</span></div>
                    <button class="btn btn-light btn-lg rounded-pill fw-bold px-4 shadow-sm" type="button">
                        <i class="bi bi-plus-circle me-2 text-primary"></i>Dodaj transakcję
                    </button>
                </div>
            </div>
            
            <!-- Tabela historii transakcji -->
            <div class="card border-0 shadow-sm rounded-4 mt-4">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                    <h5 class="fw-bold mb-0 text-muted">Historia transakcji</h5>
                </div>
                <div class="card-body p-4">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-muted">
                                <tr>
                                    <th scope="col" class="fw-semibold">Data</th>
                                    <th scope="col" class="fw-semibold">Opis</th>
                                    <th scope="col" class="fw-semibold">Kategoria</th>
                                    <th scope="col" class="fw-semibold text-end">Kwota</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Przykładowy wiersz wydatku -->
                                <tr>
                                    <td>2023-10-15</td>
                                    <td class="fw-medium">Zakupy spożywcze</td>
                                    <td><span class="badge bg-secondary opacity-75">wydatek</span></td>
                                    <td class="text-end text-danger fw-bold">-150.00 PLN</td>
                                </tr>
                                <!-- Przykładowy wiersz przychodu -->
                                <tr>
                                    <td>2023-10-10</td>
                                    <td class="fw-medium">Wypłata</td>
                                    <td><span class="badge bg-info bg-opacity-75 text-dark">przychód</span></td>
                                    <td class="text-end text-success fw-bold">+4500.00 PLN</td>
                                </tr>
                                <!-- Wyświetlanie gdy brak transakcji (opcjonalnie do obsłużenia przez backend) 
                                <tr class="d-none">
                                    <td colspan="4" class="text-center text-muted py-4">Brak ostatnich transakcji w historii.</td>
                                </tr>
                                -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
