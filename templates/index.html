<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBudget - Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .balance-card {
            background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
            color: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.15);
            border: none;
        }
        .balance-amount {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -1px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-wallet2 text-info me-2"></i>SmartBudget
        </a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card balance-card text-center p-5 mb-4">
                <div class="card-body">
                    <h5 class="card-title text-uppercase mb-3 fw-semibold opacity-75" style="letter-spacing: 2px;">Aktualne Saldo</h5>
                    <div id="balanceAmount" class="balance-amount mb-4">0.00 <span class="fs-2 fw-normal opacity-75">PLN</span></div>
                    <button class="btn btn-light btn-lg rounded-pill fw-bold px-4 shadow-sm" type="button" data-bs-toggle="modal" data-bs-target="#addTransactionModal">
                        <i class="bi bi-plus-circle me-2 text-primary"></i>Dodaj transakcję
                    </button>
                </div>
            </div>
            
            <!-- Tabela historii transakcji -->
            <div class="card border-0 shadow-sm rounded-4 mt-4">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                    <h5 class="fw-bold mb-0 text-muted">Historia transakcji</h5>
                </div>
                <div class="card-body p-4">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-muted">
                                <tr>
                                    <th scope="col" class="fw-semibold">Data</th>
                                    <th scope="col" class="fw-semibold">Opis</th>
                                    <th scope="col" class="fw-semibold">Kategoria</th>
                                    <th scope="col" class="fw-semibold text-end">Kwota</th>
                                </tr>
                            </thead>
                            <tbody id="transactionsTableBody">
                                <!-- Zawartość tabeli zostanie wypełniona przez JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Dodawania Transakcji -->
<div class="modal fade" id="addTransactionModal" tabindex="-1" aria-labelledby="addTransactionModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-header border-bottom-0 pb-0">
        <h1 class="modal-title fs-5 fw-bold" id="addTransactionModalLabel">Nowa transakcja</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button>
      </div>
      <div class="modal-body">
        <form id="addTransactionForm">
          <div class="mb-3">
            <label for="transactionAmount" class="form-label fw-semibold text-muted small mb-1">Kwota (PLN)</label>
            <input type="number" class="form-control form-control-lg bg-light border-0" id="transactionAmount" step="0.01" placeholder="0.00" required>
          </div>
          <div class="mb-3">
            <label for="transactionType" class="form-label fw-semibold text-muted small mb-1">Kategoria</label>
            <select class="form-select form-select-lg bg-light border-0" id="transactionType" required>
              <option value="wydatek" selected>Wydatek</option>
              <option value="przychód">Przychód</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="transactionDescription" class="form-label fw-semibold text-muted small mb-1">Opis</label>
            <input type="text" class="form-control bg-light border-0" id="transactionDescription" placeholder="np. Zakupy spożywcze" required>
          </div>
          <div class="mb-4">
            <label for="transactionDate" class="form-label fw-semibold text-muted small mb-1">Data</label>
            <input type="date" class="form-control bg-light border-0" id="transactionDate" required>
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">Zapisz transakcję</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="/static/script.js"></script>
</body>
</html>
